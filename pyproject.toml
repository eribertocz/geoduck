# SPDX-License-Identifier: GPL-2.0-or-later
# Este archivo configura herramientas de desarrollo. El complemento se distribuye como ZIP de QGIS
# (tools/build_zip.py); QGIS no instala este proyecto con pip.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geoduck"
dynamic = ["version"]
description = "Extensión QGIS: sesión DuckDB y entrega de resultados como capas nativas de memoria"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Dependencias de ejecución dentro del Python de QGIS. Rango amplio; el pin exacto por celda vive en
# constraints/ y compat/matrix.toml.
dependencies = ["duckdb>=1.5.0", "pyarrow>=21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.dynamic]
version = { attr = "geoduck.__version__" }

[tool.setuptools.packages.find]
include = ["geoduck*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["spec", "docs/evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802", "PLC0415"]
"tools/**" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
files = ["geoduck"]
strict = true
ignore_missing_imports = true

# La UI y la raíz de composición dependen de PyQt/PyQGIS, sin stubs tipados en CI: se validan con
# los tests de tests/qgis en QGIS real. El núcleo (domain, app, engine, infra) es estricto.
[[tool.mypy.overrides]]
module = ["geoduck.ui.*", "geoduck.plugin"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "qgis: requiere PyQGIS real",
  "engine: requiere DuckDB real",
]
