<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GeoDuck · panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#2f5fd0}a:hover{color:#234aa6}</style>
</helmet>
<div style="width: 460px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #1d2026; background: #ffffff; border-left: 1px solid #e4e6ea">

<div style="height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #e4e6ea; background: #f6f7f9">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #1f9d55"></span>
<span style="font-weight: 600">GeoDuck</span><span style="color: #6b7280; font-size: 12px">DuckDB 2.0.0</span>
<span style="flex: 1"></span>
<button aria-label="Abrir en ventana" style="height: 28px; padding: 0 10px; border: 1px solid #e4e6ea; border-radius: 6px; background: #fff; font: inherit; font-size: 12px; display: flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>Ventana</button>
</div>

<div style="padding: 8px 12px; border-bottom: 1px solid #eef0f3">
<label style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid #e4e6ea; border-radius: 7px; color: #6b7280"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input aria-label="Abrir tabla" placeholder="Abrir tabla…  Ctrl K" style="border: 0; outline: 0; background: transparent; font: inherit; flex: 1"></label>
</div>

<div style="display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid #e4e6ea">
<div style="padding: 7px 10px; border-bottom: 2px solid {{accent}}; font-weight: 500"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8a919c">T</span> consumidores</div>
<div style="padding: 7px 10px; color: #6b7280"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8a919c">SQL</span> Consulta 1</div>
<div style="padding: 7px 8px; color: #6b7280">+</div>
</div>

<div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #eef0f3">
<div style="flex: 1; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid #e4e6ea; border-radius: 7px; background: #fbfbfc; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3b4048"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"></path></svg>CodigoMunicipio = '0201'</div>
<button style="height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: {{accent}}; color: #fff; font: inherit; font-size: 12px">Aplicar</button>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden">
<div style="display: grid; grid-template-columns: 40px 86px 1fr">
<div style="height: 30px; border-bottom: 1px solid #e4e6ea; background: #fbfbfc"></div>
<div style="height: 30px; display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid #e4e6ea; background: #fbfbfc; font-weight: 600; font-size: 12px">Consumidor</div>
<div style="height: 30px; display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid #e4e6ea; background: #fbfbfc; font-weight: 600; font-size: 12px">RazonSocial</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="16">
<div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; color: #9aa1ab; font-size: 11px; border-bottom: 1px solid #f0f1f4">{{r.n}}</div>
<div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; border-bottom: 1px solid #f0f1f4">{{r.id}}</div>
<div style="height: 30px; display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid #f0f1f4; white-space: nowrap; overflow: hidden">{{r.name}}</div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid #e4e6ea; background: #fbfbfc">
<span style="color: #6b7280; font-size: 12px">1–100 de 48 312</span>
<span style="flex: 1"></span>
<button style="height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: {{accent}}; color: #fff; font: inherit; font-weight: 500">Cargar en QGIS ▾</button>
</div>
<div style="padding: 6px 12px 10px; font-size: 12px; color: #6b7280; background: #fbfbfc">Capa «consumidores» cargada · Conectada · <a href="#">Ver en el mapa</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f5fd0","options":["#2f5fd0","#1f7a4d","#7c3aed","#1d2026"]},"$preview":{"width":460,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['QUEA CONDORI RENE','SUAZNABAR VENEGAS SERGIO','SUPO HUAQUI FRANCISCA','KULJIS MERUVIA IVANKO','VASQUEZ CORRO PATRICIA','MAMANI QUISPE JUAN','FLORES ROJAS ANA','CHOQUE LIMACHI LUIS','GUTIERREZ PAZ MARIA','TORREZ VARGAS JOSE','APAZA TICONA ROSA','CRUZ ALANOCA PEDRO','LIMA QUISBERT ELENA','ROJAS PAREDES HUGO','QUISPE MAMANI EVA','ARCE LOPEZ RAUL'];
    const ids = [838835,483684,768240,189119,337261,552310,610442,731905,298114,401276,512093,677410,702334,415520,620118,377402];
    return { accent: this.props.accent ?? '#2f5fd0', rows: names.map((name, i) => ({ n: i + 1, id: ids[i], name })) };
  }
}
</script>
</body>
</html>
