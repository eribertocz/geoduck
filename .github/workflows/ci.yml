# SPDX-License-Identifier: GPL-2.0-or-later
# CI por niveles (docs/g0 y spec/qa/test-strategy.md §2).
# Linux: lint, unitarias, arquitectura, motor DuckDB real (matriz) y PyQGIS headless (conda-forge).
# Windows real: workflow separado windows-certification.yml en runner propio, solo bajo demanda.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · tipos · arquitectura · unitarias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6" "mypy>=1.10" "pytest>=8" "duckdb==2.0.0" "pyarrow==25.0.1"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest tests/unit tests/architecture -q
      - name: Integridad de spec/ (maestra y manifiesto)
        run: python tools/spec_sync.py --check
      - name: Catálogo de traducción (GD-I18N-001)
        run: python tools/i18n.py --check

  engine:
    name: motor · DuckDB ${{ matrix.duckdb }} · Py ${{ matrix.python }} · PyArrow ${{ matrix.pyarrow }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        duckdb: ["1.5.0", "1.5.6", "2.0.0"]   # mínimo, última 1.5.x, última 2.x (compat/matrix.toml)
        python: ["3.12", "3.14"]
        pyarrow: ["25.0.1"]
        numpy: [""]
        include:
          # Reproduce en Ubuntu las versiones de dependencias de QGIS 3.34.15 para Windows (PyArrow 18.1.0 y
          # NumPy 1.26.4 incluidas por QGIS, F-13). Comprueba APIs; NO es certificación Windows.
          - { duckdb: "1.5.0", python: "3.12", pyarrow: "18.1.0", numpy: "1.26.4" }
          - { duckdb: "2.0.0", python: "3.12", pyarrow: "18.1.0", numpy: "1.26.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: dependencias
        env:
          NUMPY_PIN: ${{ matrix.numpy }}
        run: |
          python -m pip install "pytest>=8" "duckdb==${{ matrix.duckdb }}" "pyarrow==${{ matrix.pyarrow }}"
          if [ -n "$NUMPY_PIN" ]; then python -m pip install "numpy==$NUMPY_PIN"; fi
      - run: >-
          python -m pytest tests/unit tests/engine -q
          --junitxml=engine-${{ matrix.duckdb }}-py${{ matrix.python }}-pa${{ matrix.pyarrow }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-${{ matrix.duckdb }}-py${{ matrix.python }}-pa${{ matrix.pyarrow }}
          path: engine-*.xml

  qgis:
    name: PyQGIS headless · QGIS ${{ matrix.qgis }} · DuckDB ${{ matrix.duckdb }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Mínima soportada (3.34), cada LTR y la última (spec/docs/compatibility-distribution.md §1).
        qgis: ["3.34.6", "3.40.3", "3.44.14", "4.2.3"]
        duckdb: ["1.5.0", "2.0.0"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qgis
          # QGIS 3.34 en conda-forge: sin fijar draco, el solver elige una que no coincide con libdraco.so.9.
          create-args: >-
            qgis=${{ matrix.qgis }} pip
            ${{ startsWith(matrix.qgis, '3.34') && 'draco=1.5.7' || '' }}
          cache-environment: true
      - run: python -m pip install "pytest>=8" "duckdb==${{ matrix.duckdb }}" "pyarrow==25.0.1"
      - run: python -c "from qgis.core import Qgis; print(Qgis.version())"
      # Entorno de pruebas, no GeoDuck: las pruebas AX con `spatial` (spatial-spec §8) la necesitan instalada.
      # GeoDuck nunca la instala por su cuenta (§10). Sin red hacia extensions.duckdb.org, se omiten.
      - name: extensión spatial para las pruebas AX
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')" || echo "spatial no disponible"
      - name: tests/qgis
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/qgis -q --junitxml=qgis-${{ matrix.qgis }}-${{ matrix.duckdb }}.xml
      - name: capturas de Workspace Pro
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/pro_shots.py screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qgis-${{ matrix.qgis }}-duckdb-${{ matrix.duckdb }}
          path: |
            qgis-*.xml
            screenshots/

  build:
    name: ZIP del complemento
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_zip.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: geoduck-plugin-zip
          path: dist/
